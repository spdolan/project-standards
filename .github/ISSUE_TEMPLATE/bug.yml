name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, input, or steps. The smallest case that shows it.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
