name: Release

# Calls spdolan/project-standards's release-please workflow. Needs release-please-config.json and
# .release-please-manifest.json. Drop line-tag for applications nobody pins.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: spdolan/project-standards/.github/workflows/release-please.yml@v0.1
    with:
      line-tag: true
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.FACTORY_RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.FACTORY_RELEASE_APP_PRIVATE_KEY }}

